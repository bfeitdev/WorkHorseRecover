name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build frontend
        run: python -m pip install build

      - name: Build wheel and sdist
        run: |
          python -c "from pathlib import Path; import shutil; [shutil.rmtree(path) for path in (Path('build'), Path('dist')) if path.exists()]"
          python -m build

      - name: Verify artifacts exist
        run: python -c "from pathlib import Path; wheels = list(Path('dist').glob('*.whl')); sdists = list(Path('dist').glob('*.tar.gz')); assert wheels, 'Missing wheel artifact'; assert sdists, 'Missing sdist artifact'"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/*

  wheel-smoke-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist

      - name: Install built wheel
        run: python -c "from pathlib import Path; import subprocess, sys; wheel = sorted(Path('dist').glob('*.whl')); assert wheel, 'Missing wheel artifact'; subprocess.run([sys.executable, '-m', 'pip', 'install', str(wheel[0])], check=True)"

      - name: Platform diagnostics
        run: python -c "import platform, sys; print('platform=', platform.platform()); print('machine=', platform.machine()); print('architecture=', platform.architecture()); print('python=', sys.version)"

      - name: Verify CLI version
        run: rdi-recover --version

      - name: Verify CLI help
        run: python -c "import subprocess, sys; cmd = ['rdi-recover', '--help']; result = subprocess.run(cmd, check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL); sys.exit(result.returncode)"

      - name: Verify module version
        run: python -m rdi_recover --version

      - name: Run synthetic tests
        run: python -m unittest discover -s tests -p 'test_*.py'
