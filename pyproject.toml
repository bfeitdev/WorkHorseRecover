[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rdi-recover"
dynamic = ["version"]
description = "Conservative recovery and validation tool for Teledyne RDI WorkHorse PD0 files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
rdi-recover = "rdi_recover.rdi_recover:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "rdi_recover._version.__version__"}
